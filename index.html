<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
        }
        .container {
            width: 100vw;
            height: 100vh;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 通过 Vercel 反向代理加载，避免 Mixed Content 错误 -->
        <iframe src="/?embedded=true" title="Law Chat Content"></iframe>
    </div>
</body>
</html>
